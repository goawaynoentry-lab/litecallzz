  <title>LiteCall</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --glass: rgba(18, 22, 33, 0.62);
      --glass-strong: rgba(20, 25, 38, 0.90);
      --glass-light: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.70);
      --accent: #38bdf8;
      --premium: #a855f7;
      --ultimate: #f59e0b;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: var(--text);
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #111827 0%, #000000 100%);
      overflow: hidden;
    }

    #remoteVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: transparent;
      z-index: 1;
    }

    #localVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      transition: all 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #localVideo.pip {
      inset: auto;
      top: calc(74px + env(safe-area-inset-top));
      right: 16px;
      width: 104px;
      height: 148px;
      border-radius: 20px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65);
      z-index: 15;
      touch-action: none;
    }

    .vignette-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 130px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent);
      pointer-events: none;
      z-index: 8;
    }

    .vignette-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 220px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
      pointer-events: none;
      z-index: 8;
    }

    .top-hud {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      max-width: 72vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }
    .dot.live {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-pill {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .icon-pill:active { transform: scale(0.92); }

    .incoming-banner {
      position: fixed;
      top: calc(68px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      max-width: 420px;
      margin: 0 auto;
      padding: 14px 16px;
      border-radius: 24px;
      background: rgba(16, 24, 39, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65), inset 0 0 0 1.5px rgba(34, 197, 94, 0.55);
      z-index: 36;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideDown 0.3s ease;
    }
    .incoming-banner.show {
      display: flex;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .incoming-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .incoming-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
    }
    .incoming-sub {
      font-size: 0.76rem;
      color: var(--success);
    }
    .incoming-btns {
      display: flex;
      gap: 8px;
    }
    .btn-ans {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--success);
      color: #032210;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-dec {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--danger);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lobby-card {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: calc(108px + env(safe-area-inset-bottom));
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 28px;
      background: var(--glass);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 22;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .lobby-card.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    .lobby-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .relay-tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
      font-weight: 600;
    }

    .lobby-sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: -6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      border: none;
      border-radius: 16px;
      padding: 13px 15px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 16px;
      outline: none;
      user-select: text;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }
    input:focus { background: rgba(255, 255, 255, 0.18); }

    .btn-join {
      border: none;
      border-radius: 16px;
      padding: 13px 20px;
      background: var(--success);
      color: #032210;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-join:active { transform: scale(0.96); }

    .chip-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chip-strip::-webkit-scrollbar { display: none; }

    .q-chip {
      border: none;
      border-radius: 999px;

      background: linear-gradient(135deg, #38bdf8, #a855f7);
      color: #fff;
    }
    .q-chip.active.ultimate {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      color: #fff;
    }

    #reactionStage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      overflow: hidden;
    }

    .floating-emoji {
      position: absolute;
      bottom: 135px;
      font-size: 2.6rem;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      animation: floatUp 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate3d(0, 20px, 0) scale(0.3) rotate(-8deg);
      }
      15% {
        opacity: 1;
        transform: translate3d(var(--sway1), -40px, 0) scale(1.18) rotate(6deg);
      }
      60% {
        opacity: 1;
        transform: translate3d(var(--sway2), -240px, 0) scale(1) rotate(-5deg);
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--sway3), -440px, 0) scale(0.85) rotate(8deg);
      }
    }

    .reaction-bar {
      position: fixed;
      bottom: calc(92px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(14px);

      pointer-events: none;

      pointer-events: auto;
      transform: translateX(-50%) translateY(0);

    .react-btn {

    .bottom-dock {
      position: fixed;

    .sheet-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;

    .sheet-title {

  </style>
</head>
<body>

  </div>

    <div class="input-row">
      <input type="text" id="turnUser" placeholder="Username" autocapitalize="none" />
      <input type="password" id="turnPass" placeholder="Credential" />

<script>
  let peer = null;
  let localStream = null;
  let activeCall = null;
  let pendingCall = null;
  let dataConn = null;
  let currentMode = "ultralite";
  let currentRoom = "";
  let inRoom = false;
  let facingMode = "user";
  let micEnabled = true;
  let camEnabled = true;
  let statsTimer = null;
  let dialRetryTimer = null;
  let wakeLock = null;
  let lastMbText = "0.0 MB";

  const PROFILES = {
    voiceonly:    { maxVideoBps: 0,        audioBps: 32000,  width: 0,    height: 0,    fps: 0,  short: "Voice Only" },
    ultralite:    { maxVideoBps: 120000,   audioBps: 32000,  width: 320,  height: 240,  fps: 15, short: "Ultra-Lite" },
    balanced:     { maxVideoBps: 300000,   audioBps: 40000,  width: 640,  height: 360,  fps: 24, short: "Balanced" },
    hd:           { maxVideoBps: 900000,   audioBps: 64000,  width: 1280, height: 720,  fps: 30, short: "HD 720p" },
    ultrapremium: { maxVideoBps: 2500000,  audioBps: 96000,  width: 1920, height: 1080, fps: 30, short: "Ultra 1080p" },
    ultrahd4k:    { maxVideoBps: 10000000, audioBps: 128000, width: 3840, height: 2160, fps: 30, short: "4K Ultimate" }
  };

  function getIceServers() {
    const servers = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "e8dd65b92f6dde431f822575",
        credential: "uWdWNmkhvyqTEAcO"
      },
      {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "e8dd65b92f6dde431f822575",
        credential: "uWdWNmkhvyqTEAcO"
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "e8dd65b92f6dde431f822575",
        credential: "uWdWNmkhvyqTEAcO"
      },
      {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "e8dd65b92f6dde431f822575",
        credential: "uWdWNmkhvyqTEAcO"
      }
    ];

    const customUrl = localStorage.getItem("turnUrl");
    if (customUrl) {
      servers.unshift({
        urls: customUrl,
        username: localStorage.getItem("turnUser") || "",
        credential: localStorage.getItem("turnPass") || ""
      });
    }
    return servers;
  }

  async function requestWakeLock() {
    if ("wakeLock" in navigator) {
      try { wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {}
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  async function initMedia() {
    const profile = PROFILES[currentMode];
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }

    const audioConstraints = {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    };

    if (profile.maxVideoBps === 0) {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
    } else {
      const candidates = [
        { facingMode, width: { ideal: profile.width }, height: { ideal: profile.height }, frameRate: { ideal: profile.fps } },
        { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        { facingMode },
        true
      ];

      for (const videoConstraint of candidates) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: videoConstraint });
          break;
        } catch (_) {}
      }

      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
      }
    }

    const lv = document.getElementById("localVideo");
    lv.srcObject = localStream;
    lv.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";
    const hasVideo = localStream.getVideoTracks().length > 0;
    camEnabled = hasVideo && profile.maxVideoBps > 0;
    updateControlButtons();
    return localStream;
  }

  async function ensureMediaReady() {
    if (localStream && localStream.active) return localStream;
    try {
      return await initMedia();
    } catch (_) {
      localStream = new MediaStream();
      return localStream;
    }
  }

  function sanitizeRoom(raw) {
    return raw.toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24);
  }

  async function joinRoom() {
    const room = sanitizeRoom(document.getElementById("roomInput").value.trim());
    if (!room) return alert("Type a room name first (e.g. hangout).");
    currentRoom = room;
    inRoom = true;
    document.getElementById("roomInput").value = room;

    await ensureMediaReady();
    await requestWakeLock();

    document.getElementById("lobbyCard").classList.add("hidden");
    document.getElementById("hangupBtn").style.display = "flex";
    updateHud(`Joining "${room}"...`);

    const hostId = `litecall-${room}-host`;
    connectAsHostOrGuest(hostId, room);
  }

  function connectAsHostOrGuest(hostId, room) {
    clearInterval(dialRetryTimer);
    if (peer) {
      try { peer.destroy(); } catch (_) {}
    }

    const iceConfig = {
      iceServers: getIceServers(),
      iceCandidatePoolSize: 4
    };

    peer = new Peer(hostId, {
      debug: 1,
      config: iceConfig
    });

    peer.on("open", () => {
      document.getElementById("statusDot").classList.add("live");
      updateHud(`Room "${room}" • Waiting`);
    });

    peer.on("connection", (conn) => {
      setupDataChannel(conn);
    });

    peer.on("call", async (call) => {
      await handleIncomingCall(call, room);
    });

    peer.on("disconnected", () => {
      if (!inRoom) return;
      updateHud("Reconnecting signal...");
      setTimeout(() => {
        if (peer && !peer.destroyed && inRoom) {
          try { peer.reconnect(); } catch (_) {}
        }
      }, 1200);
    });

    peer.on("error", (err) => {
      if (!inRoom) return;
      if (err.type === "unavailable-id") {
        try { peer.destroy(); } catch (_) {}
        peer = new Peer(undefined, {
          debug: 1,
          config: iceConfig
        });

        peer.on("open", () => {
          document.getElementById("statusDot").classList.add("live");
          dialHostWithRetry(hostId, room);
        });

        peer.on("connection", (conn) => {
          setupDataChannel(conn);
        });

        peer.on("call", async (call) => {
          await handleIncomingCall(call, room);
        });

        peer.on("disconnected", () => {
          if (peer && !peer.destroyed && inRoom) {
            try { peer.reconnect(); } catch (_) {}
          }
        });

        peer.on("error", (guestErr) => {
          if (guestErr.type === "peer-unavailable" && inRoom) {
            updateHud(`Waiting in "${room}"...`);
            setTimeout(() => {
              if (inRoom && !activeCall) connectAsHostOrGuest(hostId, room);
            }, 2000);
          } else {
            updateHud(`Signal: ${guestErr.type}`);
          }
        });
      } else {
        updateHud(`Signal: ${err.type}`);
      }
    });
  }

  function isCallHealthyOrNegotiating() {
    if (!activeCall) return false;
    if (document.getElementById("remoteVideo").srcObject) return true;
    const pc = activeCall.peerConnection;
    if (!pc) return false;
    const s = pc.iceConnectionState;
    return s === "new" || s === "checking" || s === "connected" || s === "completed";
  }

  function dialHostWithRetry(hostId, room) {
    clearInterval(dialRetryTimer);
    let attempts = 0;

    const attemptDial = async (forceRestart = false) => {
      if (!inRoom || !peer || peer.destroyed) {
        clearInterval(dialRetryTimer);
        return;
      }
      if (document.getElementById("remoteVideo").srcObject) {
        clearInterval(dialRetryTimer);
        return;
      }
      if (!forceRestart && isCallHealthyOrNegotiating()) {
        return;
      }

      attempts++;
      updateHud(attempts === 1 ? `Calling "${room}"...` : `Connecting "${room}" (${attempts})...`);

      const stream = await ensureMediaReady();
      if (!dataConn || !dataConn.open) {
        const conn = peer.connect(hostId, { reliable: true });
        setupDataChannel(conn);
      }

      if (activeCall) {
        try { activeCall.close(); } catch (_) {}
      }
      const call = peer.call(hostId, stream);
      if (call) bindCallEvents(call, room);
    };

    attemptDial(true);
    // Allow 12 seconds per attempt so international/cellular TURN relays finish negotiating
    dialRetryTimer = setInterval(() => {
      if (attempts >= 8 || document.getElementById("remoteVideo").srcObject) {
        clearInterval(dialRetryTimer);
        return;
      }
      attemptDial(true);
    }, 12000);
  }

  async function handleIncomingCall(call, room) {
    if (inRoom) {
      if (activeCall && activeCall !== call) {
        try { activeCall.close(); } catch (_) {}
      }
      const stream = await ensureMediaReady();
      call.answer(stream);
      bindCallEvents(call, room);
    } else {
      pendingCall = call;
      document.getElementById("incomingSub").textContent = `Room "${room}" • Tap Answer`;
      document.getElementById("incomingBanner").classList.add("show");
    }
  }

  async function acceptIncomingCall() {
    document.getElementById("incomingBanner").classList.remove("show");
    if (!pendingCall) return;
    const call = pendingCall;
    pendingCall = null;
    inRoom = true;
    await requestWakeLock();
    document.getElementById("lobbyCard").classList.add("hidden");
    document.getElementById("hangupBtn").style.display = "flex";
    const stream = await ensureMediaReady();
    call.answer(stream);
    bindCallEvents(call, currentRoom || "call");
  }

  function declineIncomingCall() {
    document.getElementById("incomingBanner").classList.remove("show");
    if (pendingCall) {
      try { pendingCall.close(); } catch (_) {}
      pendingCall = null;
    }
  }

  function setupDataChannel(conn) {
    dataConn = conn;
    conn.on("open", () => {
      conn.send({ type: "hello", mode: currentMode });
    });
    conn.on("data", (payload) => {
      if (!payload) return;
      if (payload.type === "reaction" && payload.emoji) {
        spawnReactionBurst(payload.emoji);
      } else if (payload.type === "hello") {
        // Fallback reverse-dial if Host sees Guest connected on data channel without media stream yet
        setTimeout(async () => {
          if (inRoom && !document.getElementById("remoteVideo").srcObject && conn.peer && peer && !peer.destroyed) {
            const stream = await ensureMediaReady();
            const call = peer.call(conn.peer, stream);
            if (call) bindCallEvents(call, currentRoom);
          }
        }, 2500);
      }
    });
  }

  function bindCallEvents(call, room) {
    activeCall = call;

    const attachIceMonitor = () => {
      const pc = call.peerConnection;
      if (!pc) return;
      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        if (state === "connected" || state === "completed") {
          clearInterval(dialRetryTimer);
          document.getElementById("statusDot").classList.add("live");
        } else if (state === "disconnected" || state === "failed") {
          updateHud("Weak signal • Reconnecting...");
          if (typeof pc.restartIce === "function") {
            try { pc.restartIce(); } catch (_) {}
          }
        }
      };
    };

    attachIceMonitor();
    setTimeout(attachIceMonitor, 400);

    call.on("stream", (remoteStream) => {
      clearInterval(dialRetryTimer);
      document.getElementById("incomingBanner").classList.remove("show");
      const rv = document.getElementById("remoteVideo");
      rv.srcObject = remoteStream;
      rv.muted = false;
      document.getElementById("localVideo").classList.add("pip");

      rv.play().catch(() => {
        rv.muted = true;
        rv.play().catch(() => {});
        document.getElementById("unmuteOverlay").style.display = "block";
      });

      applyBandwidthCap();
      startStatsMonitor(room);
    });

    call.on("close", () => {
      if (activeCall === call) {
        document.getElementById("remoteVideo").srcObject = null;
        document.getElementById("localVideo").classList.remove("pip");
        updateHud(`Room "${room}" • Waiting`);
      }
    });

    call.on("error", () => {
      updateHud(`Retrying "${room}"...`);
    });
  }

  function forcePlayRemote() {
    const rv = document.getElementById("remoteVideo");
    if (rv.srcObject) {
      rv.muted = false;
      rv.play().catch(() => {});
    }
    document.getElementById("unmuteOverlay").style.display = "none";
  }

  document.addEventListener("touchstart", () => {
    const overlay = document.getElementById("unmuteOverlay");
    if (overlay && overlay.style.display === "block") {
      forcePlayRemote();
    }
  }, { passive: true });

  async function applyBandwidthCap() {
    const profile = PROFILES[currentMode];
    if (!activeCall || !activeCall.peerConnection) return;

    for (const sender of activeCall.peerConnection.getSenders()) {
      if (!sender.track) continue;
      const params = sender.getParameters();
      if (!params.encodings) params.encodings = [{}];

      if (sender.track.kind === "video") {
        sender.track.enabled = profile.maxVideoBps > 0 && camEnabled;
        if (profile.maxVideoBps > 0) {
          params.encodings[0].maxBitrate = profile.maxVideoBps;
          params.encodings[0].maxFramerate = profile.fps;
        }
      } else if (sender.track.kind === "audio") {
        params.encodings[0].maxBitrate = profile.audioBps;
      }
      await sender.setParameters(params).catch(() => {});
    }
  }

  async function selectQuality(mode) {
    currentMode = mode;
    const profile = PROFILES[mode];

    document.querySelectorAll(".q-chip").forEach(chip => {
      const active = chip.dataset.mode === mode;
      chip.classList.toggle("active", active);
      chip.classList.toggle("premium", active && mode === "ultrapremium");
      chip.classList.toggle("ultimate", active && mode === "ultrahd4k");
    });

    document.querySelectorAll(".quality-option").forEach(opt => {
      const active = opt.dataset.mode === mode;
      opt.classList.toggle("selected", active);
      opt.classList.toggle("premium-opt", active && mode === "ultrapremium");
      opt.classList.toggle("ultimate-opt", active && mode === "ultrahd4k");
    });

    updateHud(`${profile.short} • ${lastMbText}`);

    if (localStream) {
      await initMedia().catch(() => {});
      if (activeCall && activeCall.peerConnection) {
        const newVideoTrack = localStream.getVideoTracks()[0] || null;
        const sender = activeCall.peerConnection.getSenders().find(s => s.track?.kind === "video");
        if (sender && newVideoTrack) {
          await sender.replaceTrack(newVideoTrack);
        }
      }
      await applyBandwidthCap();
    }
  }

  function startStatsMonitor(room) {
    clearInterval(statsTimer);
    statsTimer = setInterval(async () => {
      if (!activeCall || !activeCall.peerConnection) return;
      const stats = await activeCall.peerConnection.getStats();
      let totalBytes = 0;
      let routeType = "P2P Direct";

      stats.forEach(report => {
        if (report.type === "outbound-rtp" || report.type === "inbound-rtp") {
          totalBytes += (report.bytesSent || 0) + (report.bytesReceived || 0);
        }
        if (report.type === "candidate-pair" && report.state === "succeeded") {
          const localCand = stats.get(report.localCandidateId);
          if (localCand && localCand.candidateType === "relay") {
            routeType = "TURN Relay (Long-Distance)";
          }
        }
      });

      const mb = (totalBytes / (1024 * 1024)).toFixed(2);
      lastMbText = `${mb} MB`;
      document.getElementById("sheetMbBadge").textContent = `${mb} MB used`;
      document.getElementById("routeBadge").textContent = routeType;
      updateHud(`${PROFILES[currentMode].short} • ${mb} MB`);
    }, 2000);
  }

  function updateHud(text) {
    document.getElementById("hudStatus").textContent = text;
  }

  function leaveRoom() {
    inRoom = false;
    clearInterval(statsTimer);
    clearInterval(dialRetryTimer);
    releaseWakeLock();
    if (dataConn) try { dataConn.close(); } catch (_) {}
    if (activeCall) try { activeCall.close(); } catch (_) {}
    if (pendingCall) try { pendingCall.close(); } catch (_) {}
    if (peer) try { peer.destroy(); } catch (_) {}
    dataConn = null;
    activeCall = null;
    pendingCall = null;
    peer = null;

    document.getElementById("statusDot").classList.remove("live");
    document.getElementById("incomingBanner").classList.remove("show");
    document.getElementById("unmuteOverlay").style.display = "none";
    document.getElementById("remoteVideo").srcObject = null;
    document.getElementById("localVideo").classList.remove("pip");
    document.getElementById("lobbyCard").classList.remove("hidden");
    document.getElementById("hangupBtn").style.display = "none";
    document.getElementById("reactionBar").classList.remove("open");
    document.getElementById("reactToggleBtn").classList.remove("active-pill");
    updateHud(`${PROFILES[currentMode].short} • Ready`);
  }

  function toggleReactionBar() {
    const bar = document.getElementById("reactionBar");
    const btn = document.getElementById("reactToggleBtn");
    const isOpen = bar.classList.toggle("open");
    btn.classList.toggle("active-pill", isOpen);
  }

  function sendReaction(emoji) {
    spawnReactionBurst(emoji);
    if (dataConn && dataConn.open) {
      dataConn.send({ type: "reaction", emoji });
    }
  }

  function spawnReactionBurst(emoji) {
    const stage = document.getElementById("reactionStage");
    const count = 4;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement("div");
        el.className = "floating-emoji";
        el.textContent = emoji;
        const startX = 18 + Math.random() * 64;
        el.style.left = `${startX}vw`;
        el.style.setProperty("--sway1", `${(Math.random() - 0.5) * 40}px`);
        el.style.setProperty("--sway2", `${(Math.random() - 0.5) * 70}px`);
        el.style.setProperty("--sway3", `${(Math.random() - 0.5) * 90}px`);
        stage.appendChild(el);
        setTimeout(() => el.remove(), 2700);
      }, i * 110);
    }
  }

  function toggleMic() {
    if (!localStream) return;
    micEnabled = !micEnabled;
    localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
    updateControlButtons();
  }

  function toggleCam() {
    if (!localStream) return;
    camEnabled = !camEnabled;
    localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
    updateControlButtons();
  }

  async function flipCamera() {
    facingMode = facingMode === "user" ? "environment" : "user";
    if (!localStream) return;
    await initMedia();
    if (activeCall && activeCall.peerConnection) {
      const videoTrack = localStream.getVideoTracks()[0];
      const sender = activeCall.peerConnection.getSenders().find(s => s.track?.kind === "video");
      if (sender && videoTrack) await sender.replaceTrack(videoTrack);
    }
  }

  function updateControlButtons() {
    document.getElementById("micBtn").classList.toggle("off", !micEnabled);
    document.getElementById("camBtn").classList.toggle("off", !camEnabled);
  }

  function openSettings() {
    document.getElementById("sheetBackdrop").classList.add("open");
    document.getElementById("settingsSheet").classList.add("open");
  }

  function closeSettings() {
    document.getElementById("sheetBackdrop").classList.remove("open");
    document.getElementById("settingsSheet").classList.remove("open");
  }

  function saveServerSettings() {
    localStorage.setItem("turnUrl", document.getElementById("turnUrl").value.trim());
    localStorage.setItem("turnUser", document.getElementById("turnUser").value.trim());
    localStorage.setItem("turnPass", document.getElementById("turnPass").value.trim());
    closeSettings();
  }

  async function shareRoomLink() {
    const room = sanitizeRoom(document.getElementById("roomInput").value.trim()) || "chat-" + Math.floor(100 + Math.random() * 900);
    document.getElementById("roomInput").value = room;
    const url = `${location.origin}${location.pathname}?room=${room}`;

    if (navigator.share) {
      await navigator.share({ title: "Join my LiteCall room", url }).catch(() => {});
    } else {
      await navigator.clipboard.writeText(url);
      updateHud(`Link copied for "${room}"`);
    }
  }

  (function makePipDraggable() {
    const pip = document.getElementById("localVideo");
    let dragging = false, offsetX = 0, offsetY = 0;

    pip.addEventListener("touchstart", (e) => {
      if (!pip.classList.contains("pip")) return;
      dragging = true;
      const rect = pip.getBoundingClientRect();
      offsetX = e.touches[0].clientX - rect.left;
      offsetY = e.touches[0].clientY - rect.top;
      pip.style.transition = "none";
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const x = Math.max(12, Math.min(window.innerWidth - pip.offsetWidth - 12, e.touches[0].clientX - offsetX));
      const y = Math.max(64, Math.min(window.innerHeight - pip.offsetHeight - 100, e.touches[0].clientY - offsetY));
      pip.style.left = `${x}px`;
      pip.style.top = `${y}px`;
      pip.style.right = "auto";
    }, { passive: true });

    window.addEventListener("touchend", () => {
      if (dragging) {
        dragging = false;
        pip.style.transition = "all 0.3s ease";
      }
    });
  })();

  window.addEventListener("load", async () => {
    document.getElementById("turnUrl").value = localStorage.getItem("turnUrl") || "";
    document.getElementById("turnUser").value = localStorage.getItem("turnUser") || "";
    document.getElementById("turnPass").value = localStorage.getItem("turnPass") || "";

    const params = new URLSearchParams(window.location.search);
    if (params.get("room")) {
      document.getElementById("roomInput").value = sanitizeRoom(params.get("room"));
    }

    await initMedia().catch(() => {});
  });
</script>
</body>
